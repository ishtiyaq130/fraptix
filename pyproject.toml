[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fraptix"
version = "0.1.0"
description = "Security, performance and code quality analyzer for Frappe applications"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Fraptix Contributors"},
]
keywords = [
    "frappe",
    "erpnext",
    "static-analysis",
    "security",
    "performance",
    "linter",
    "code-quality",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]

dependencies = [
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/ishtiyaq130/fraptix"
Repository = "https://github.com/ishtiyaq130/fraptix"
Issues = "https://github.com/ishtiyaq130/fraptix/issues"
Discussions = "https://github.com/ishtiyaq130/fraptix/discussions"

[project.scripts]
fraptix = "fraptix.cli:main"

[tool.setuptools.packages.find]
include = ["fraptix*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
