[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraptix"
version = "0.1.0"
description = "Security, performance and code quality analyzer for Frappe applications"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Fraptix Contributors"}
]

dependencies = [
    "rich>=13.0",
]

[project.scripts]
fraptix = "fraptix.cli:main"

[tool.setuptools.packages.find]
include = ["fraptix*"]